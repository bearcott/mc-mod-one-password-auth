plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// One version for both jars, taken from the release tag in CI (MOD_VERSION) or gradle.properties.
subprojects {
	apply plugin: 'java'

	version = System.getenv("MOD_VERSION") ?: rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}
