plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = "${rootProject.archives_base_name}-fabric"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"one-password-auth" {
			sourceSet sourceSets.main
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

	implementation project(':core')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// The shared core ships inside the mod jar.
	from(project(':core').sourceSets.main.output)

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

sourcesJar {
	from(project(':core').sourceSets.main.allSource)
}
